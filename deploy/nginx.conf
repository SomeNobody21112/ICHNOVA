# ICHNOVA — HTTPS reverse proxy in front of the authenticated API.
#
#   client --HTTPS--> nginx --HTTP on a private address--> ICHNOVA (server/app.py)
#
# The Python server does not terminate TLS and is not meant to. It binds a private address and is
# reached only through this proxy. Status: IMPLEMENTED / CONFIGURED. This file is exercised by
# deploy/docker-compose.yml and by the checks in deploy/README.md, but ICHNOVA has never been
# operated in production, so nothing here is LIVE or DEPLOYED.
#
# Certificates are never committed. Mount real ones at the paths below.

# ---- limits shared by both server blocks -----------------------------------------------------
# Matches MAX_UPLOAD in server/app.py (64 MB). Keep the two in step: a proxy cap that is higher
# wastes a whole upload before the application refuses it; one that is lower replaces a 413 with an
# explanation by an unexplained one from nginx.
client_max_body_size 64m;
client_body_timeout 60s;
client_header_timeout 20s;
send_timeout 120s;

# Sign-in is rate limited at the edge as well as inside the application. Both are needed: this one
# does not know who the user is, and that one does not see the connection.
limit_req_zone $binary_remote_addr zone=ichnova_auth:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=ichnova_conn:10m;

upstream ichnova {
    server ichnova:8765;
    keepalive 16;
}

# ---- 1. plain HTTP: redirect, except the ACME challenge --------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ichnova.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

# ---- 2. HTTPS ---------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ichnova.example.org;

    # Certificate and key. Never committed to this repository; mounted at run time.
    ssl_certificate         /etc/letsencrypt/live/ichnova.example.org/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/ichnova.example.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ichnova.example.org/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ichnova_tls:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS. Turn this on only once renewal is known to work: a browser that has seen it refuses
    # plain HTTP to this host for the whole max-age, including during a broken renewal.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The application sets Content-Security-Policy, X-Content-Type-Options, Referrer-Policy,
    # X-Frame-Options and Permissions-Policy on every reply (server/app.py, end_headers). They are
    # deliberately not repeated here: two sources for one header is how they drift apart.

    # CORS: none. The console is served from this same origin, so the API needs no cross-origin
    # access and emits no Access-Control-Allow-Origin. Do not add one here "to be safe" — its
    # absence is the whole of the API's cross-origin defence. If the console is ever hosted
    # separately, allow exactly one origin and nothing else:
    #   add_header Access-Control-Allow-Origin "https://console.example.org" always;
    #   add_header Vary Origin always;

    limit_conn ichnova_conn 24;

    location / {
        proxy_pass http://ichnova;
        proxy_http_version 1.1;

        # Identity for the application's rate limiter. $remote_addr REPLACES whatever the client
        # sent, so the header carries exactly one entry: the address nginx actually saw. The
        # application reads the rightmost entry, and only when the peer is listed in
        # ICHNOVA_TRUSTED_PROXIES, so a client cannot name itself. Changing this to
        # $proxy_add_x_forwarded_for for a multi-hop deployment is also safe: the rightmost entry
        # is still the address this proxy saw, which is still the one the application reads.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host $host;

        # Analysis is synchronous and a 64 MB capture takes time. A short read timeout turns a slow
        # but correct answer into a 504 and loses the evidence receipt that was about to be written.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;    # stream the upload; do not spool 64 MB to disk first
    }

    location = /api/auth/login {
        limit_req zone=ichnova_auth burst=5 nodelay;
        proxy_pass http://ichnova;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    # Server-Sent Events for a live session. Buffering here holds every spectrum row until the
    # session ends, which looks exactly like a hung receiver.
    location = /api/live/events {
        proxy_pass http://ichnova;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Health carries the engine version and the live-session count, nothing else. It is
    # unauthenticated by design; keep it off the public internet if the deployment is internal.
    location = /api/health {
        proxy_pass http://ichnova;
        proxy_set_header Host $host;
        access_log off;
    }
}
